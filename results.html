<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>結果一覧（管理者用）｜スイカン面接評価</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{--blue:#2563eb;--blue-dark:#1d4ed8;--bg:#f5f7fa;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--danger:#dc2626;--ok:#16a34a;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
  header{background:var(--blue);color:#fff;padding:20px 16px;}
  header h1{margin:0;font-size:1.25rem;}
  nav.top{max-width:1000px;margin:0 auto;padding:10px 16px 0;display:flex;gap:12px;}
  nav.top a{color:#fff;opacity:0.85;text-decoration:none;font-size:0.85rem;border-bottom:2px solid transparent;padding-bottom:8px;}
  nav.top a.active{opacity:1;border-color:#fff;font-weight:bold;}
  main{max-width:1000px;margin:0 auto;padding:20px 16px 80px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:18px;}
  .gate{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .gate input{flex:1;min-width:200px;padding:10px;border:1px solid var(--border);border-radius:6px;font-size:0.95rem;}
  .gate button{background:var(--blue);color:#fff;border:none;padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:bold;}
  .gate button:hover{background:var(--blue-dark);}
  .msg{margin-top:12px;font-size:0.85rem;}
  .msg.err{color:var(--danger);}
  table{width:100%;border-collapse:collapse;font-size:0.85rem;}
  th,td{border-bottom:1px solid var(--border);padding:8px 6px;text-align:left;white-space:nowrap;}
  th{background:#f8fafc;position:sticky;top:0;cursor:pointer;}
  tr:hover{background:#f8fafc;cursor:pointer;}
  .badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:0.75rem;font-weight:bold;}
  .badge.ok{background:#ecfdf5;color:var(--ok);}
  .badge.ng{background:#fef2f2;color:var(--danger);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
  .toolbar button{background:#fff;border:1px solid var(--border);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:0.85rem;}
  .table-wrap{overflow-x:auto;}
  .detail{position:fixed;inset:0;background:rgba(15,23,42,0.5);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;z-index:10;}
  .detail.show{display:flex;}
  .detail-inner{background:#fff;border-radius:10px;max-width:680px;width:100%;padding:24px;margin-top:20px;}
  .detail-inner h2{margin-top:0;font-size:1.1rem;}
  .detail-inner .row{margin-bottom:10px;font-size:0.9rem;}
  .detail-inner .row b{display:block;color:var(--muted);font-size:0.75rem;margin-bottom:2px;}
  .detail-inner .qa{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:0.85rem;}
  .closeBtn{float:right;background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--muted);}
  #loading{display:none;color:var(--muted);font-size:0.9rem;}
</style>
</head>
<body>
<header>
  <nav class="top"><a href="index.html">評価入力</a><a href="results.html" class="active">結果一覧（管理者用）</a></nav>
  <h1>候補者 結果一覧（管理者用）</h1>
</header>
<main>
  <div class="card" id="gateCard">
    <p style="margin-top:0;font-size:0.9rem;color:var(--muted);">閲覧用パスフレーズを入力してください。</p>
    <div class="gate">
      <input type="password" id="pwInput" placeholder="パスフレーズ">
      <button id="loadBtn">表示する</button>
    </div>
    <div class="msg err" id="gateErr" style="display:none;"></div>
    <div id="loading">読み込み中...</div>
  </div>

  <div class="card" id="listCard" style="display:none;">
    <div class="toolbar">
      <span id="countLabel" style="font-size:0.85rem;color:var(--muted);"></span>
      <button id="csvBtn">CSVダウンロード</button>
    </div>
    <div class="table-wrap">
      <table id="resultTable">
        <thead>
          <tr>
            <th data-key="candidate_name">候補者氏名</th>
            <th data-key="interview_date">面接日</th>
            <th data-key="interviewer_name">面接官名</th>
            <th data-key="weighted_total">加重合計点</th>
            <th data-key="score_pct">得点率</th>
            <th data-key="judge">合否判定</th>
            <th data-key="disc_type">DISCタイプ</th>
            <th data-key="created_at">送信日時</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="detail" id="detailModal">
  <div class="detail-inner" id="detailInner"></div>
</div>

<script>
let rows = [];
let sortKey = 'created_at';
let sortDir = -1;
let currentPw = '';

const SQ_LABELS = ["Q1. きっかけ","Q2. 不安な点","Q3. 年下からの指導経験","Q4. 大変だった経験","Q5. 意見の違う相手との折り合い","Q6. ルール順守への考え","Q7. 屋外・体力作業への意欲","Q8. 腰を据えて取り組む期間","Q9. 5年後10年後の展望","Q10. 転職で大切にしたいこと"];
const CRIT_LABELS = ["①素直さ・受容力","②誠実さ・正直さ","③協調性・チームワーク","④責任感・やり抜く力","⑤向上心・成長ポテンシャル","⑥規範意識・安全遵守","⑦コミュニケーション力","⑧定着可能性・価値観の一致"];

document.getElementById('loadBtn').addEventListener('click', loadResults);
document.getElementById('pwInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') loadResults(); });

async function loadResults(){
  const gateErr = document.getElementById('gateErr');
  const loading = document.getElementById('loading');
  gateErr.style.display = 'none';
  const pw = document.getElementById('pwInput').value;
  if(!pw){ gateErr.textContent = 'パスフレーズを入力してください。'; gateErr.style.display='block'; return; }

  if(!SUPABASE_URL || SUPABASE_URL.indexOf('YOUR_') === 0){
    gateErr.textContent = 'アプリの設定が未完了です（config.js を確認してください）。';
    gateErr.style.display = 'block';
    return;
  }

  loading.style.display = 'block';
  try{
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await client.rpc('get_results', { pw: pw });
    if(error) throw error;
    if(!data || data.length === 0){
      gateErr.textContent = 'パスフレーズが違うか、データがまだありません。';
      gateErr.style.display = 'block';
      loading.style.display = 'none';
      return;
    }
    rows = data;
    currentPw = pw;
    document.getElementById('gateCard').style.display = 'none';
    document.getElementById('listCard').style.display = 'block';
    render();
  }catch(err){
    console.error(err);
    gateErr.textContent = '読み込みに失敗しました: ' + (err.message || err);
    gateErr.style.display = 'block';
  }finally{
    loading.style.display = 'none';
  }
}

document.querySelectorAll('#resultTable th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if(sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
    render();
  });
});

function render(){
  const sorted = [...rows].sort((a,b) => {
    let av = a[sortKey], bv = b[sortKey];
    if(av === null || av === undefined) av = '';
    if(bv === null || bv === undefined) bv = '';
    if(typeof av === 'number' && typeof bv === 'number') return (av-bv)*sortDir;
    return String(av).localeCompare(String(bv), 'ja') * sortDir;
  });
  document.getElementById('countLabel').textContent = `${sorted.length} 件`;
  const tbody = document.getElementById('resultBody');
  tbody.innerHTML = '';
  sorted.forEach(r => {
    const tr = document.createElement('tr');
    const badgeClass = (r.judge || '').indexOf('◎') === 0 ? 'ok' : 'ng';
    tr.innerHTML = `
      <td>${escapeHtml(r.candidate_name)}</td>
      <td>${escapeHtml(r.interview_date)}</td>
      <td>${escapeHtml(r.interviewer_name)}</td>
      <td>${r.weighted_total}</td>
      <td>${r.score_pct}%</td>
      <td><span class="badge ${badgeClass}">${escapeHtml(r.judge)}</span></td>
      <td>${escapeHtml(r.disc_type)}</td>
      <td>${new Date(r.created_at).toLocaleString('ja-JP')}</td>
    `;
    tr.addEventListener('click', () => showDetail(r));
    tbody.appendChild(tr);
  });
}

function showDetail(r){
  const inner = document.getElementById('detailInner');
  let qaHtml = '';
  for(let i=1;i<=10;i++){
    const v = r['q'+i];
    if(v) qaHtml += `<div class="row"><b>${SQ_LABELS[i-1]}</b><div class="qa">${escapeHtml(v)}</div></div>`;
  }
  let critHtml = '<div class="row"><b>評価シート（8項目）</b><div class="qa">' +
    CRIT_LABELS.map((label,i) => `${label}: ${r['crit'+(i+1)]}点`).join(' / ') + '</div></div>';
  let discHtml = `<div class="row"><b>DISC集計</b><div class="qa">D合計 ${r.disc_d_total} / I合計 ${r.disc_i_total} / S合計 ${r.disc_s_total} / C合計 ${r.disc_c_total}</div></div>`;

  inner.innerHTML = `
    <button class="closeBtn" id="closeDetail">×</button>
    <h2>${escapeHtml(r.candidate_name)}（${escapeHtml(r.interview_date)} / 面接官: ${escapeHtml(r.interviewer_name)}）</h2>
    <div class="row"><b>加重合計点</b>${r.weighted_total} 点（${r.score_pct}%） ／ 最低得点 ${r.min_score} 点</div>
    <div class="row"><b>合否判定</b>${escapeHtml(r.judge)}</div>
    <div class="row"><b>DISCタイプ</b>${escapeHtml(r.disc_type)}</div>
    <div class="row"><b>DISC自動解説</b><div class="qa">${escapeHtml(r.disc_profile)}</div></div>
    ${discHtml}
    ${critHtml}
    ${qaHtml}
  `;
  document.getElementById('detailModal').classList.add('show');
  document.getElementById('closeDetail').addEventListener('click', () => {
    document.getElementById('detailModal').classList.remove('show');
  });
}

document.getElementById('detailModal').addEventListener('click', (e) => {
  if(e.target.id === 'detailModal') document.getElementById('detailModal').classList.remove('show');
});

document.getElementById('csvBtn').addEventListener('click', () => {
  if(rows.length === 0) return;
  const headers = Object.keys(rows[0]);
  const csvLines = [headers.join(',')];
  rows.forEach(r => {
    csvLines.push(headers.map(h => {
      let v = r[h];
      if(v === null || v === undefined) v = '';
      v = String(v).replace(/"/g,'""');
      return `"${v}"`;
    }).join(','));
  });
  const blob = new Blob(["﻿" + csvLines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sukan_evaluations_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
});

function escapeHtml(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
