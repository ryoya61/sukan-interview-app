<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>結果一覧（管理者用）｜スイカン面接評価</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --blue:#128c83;--blue-dark:#0d6e67;--bg:#f5f7fa;--card:#ffffff;--border:#e8edf2;--text:#1e293b;--muted:#64748b;
    /* status palette (fixed, never themed) */
    --good:#0ca30c;--good-bg:#e8f8e8;--good-text:#0a6b0a;
    --critical:#d03b3b;--critical-bg:#fbeaea;--critical-text:#a52323;
    /* categorical slots (fixed order — used for DISC identity D/I/S/C) */
    --cat-1:#2a78d6; /* D */
    --cat-2:#eb6834; /* I */
    --cat-3:#1baf7a; /* S */
    --cat-4:#c98500; /* C — darkened one step from #eda100 for label contrast */
    /* sequential blue ramp (magnitude, 1→5) */
    --seq-1:#86b6ef;--seq-2:#5598e7;--seq-3:#2a78d6;--seq-4:#1c5cab;--seq-5:#104281;
    --ink-primary:#0b0b0b;--ink-secondary:#52514e;--ink-muted:#898781;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
  header{background:var(--blue);color:#fff;padding:22px 16px 26px;border-radius:0 0 22px 22px;box-shadow:0 10px 24px -12px rgba(18,140,131,0.45);}
  header h1{margin:4px 0 0;font-size:1.25rem;font-weight:800;}
  nav.top{max-width:1000px;margin:0 auto;padding:0 16px;display:flex;gap:6px;}
  nav.top a{color:rgba(255,255,255,0.85);text-decoration:none;font-size:0.82rem;padding:6px 14px;border-radius:999px;transition:background 0.15s,color 0.15s;}
  nav.top a.active{background:#fff;color:var(--blue-dark);font-weight:700;}
  nav.top a:not(.active):hover{background:rgba(255,255,255,0.14);}
  main{max-width:1000px;margin:0 auto;padding:20px 16px 80px;}
  .card{background:var(--card);border:1px solid rgba(15,23,42,0.06);border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 1px 2px rgba(15,23,42,0.04),0 12px 28px -18px rgba(15,23,42,0.14);}
  .gate{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .gate input{flex:1;min-width:200px;padding:11px 12px;border:1px solid var(--border);border-radius:12px;font-size:0.95rem;}
  .gate input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,140,131,0.15);}
  .gate button{background:var(--blue);color:#fff;border:none;padding:10px 20px;border-radius:999px;cursor:pointer;font-weight:bold;box-shadow:0 6px 14px -6px rgba(18,140,131,0.5);}
  .gate button:hover{background:var(--blue-dark);}
  .msg{margin-top:12px;font-size:0.85rem;}
  .msg.err{color:var(--critical-text);}
  table{width:100%;border-collapse:collapse;font-size:0.85rem;}
  th,td{border-bottom:1px solid var(--border);padding:8px 6px;text-align:left;white-space:nowrap;}
  th{background:#f3f8f7;position:sticky;top:0;cursor:pointer;}
  tr:hover{background:#f3f8f7;cursor:pointer;}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:0.75rem;font-weight:bold;}
  .badge.ok{background:var(--good-bg);color:var(--good-text);}
  .badge.ng{background:var(--critical-bg);color:var(--critical-text);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
  .toolbar button{background:#fff;border:1px solid var(--border);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:0.85rem;}
  .table-wrap{overflow-x:auto;}
  .detail{position:fixed;inset:0;background:rgba(15,23,42,0.5);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;z-index:10;}
  .detail.show{display:flex;}
  .detail-inner{background:#fff;border-radius:20px;max-width:720px;width:100%;padding:0 0 24px;margin-top:20px;overflow:hidden;}
  .closeBtn{background:rgba(255,255,255,0.18);border:none;width:28px;height:28px;border-radius:50%;font-size:1.1rem;cursor:pointer;color:#fff;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;}
  .closeBtn:hover{background:rgba(255,255,255,0.3);}

  /* ---- detail header ---- */
  .d-head{position:relative;background:var(--blue);color:#fff;padding:16px 24px 18px;}
  .d-head h2{margin:0 0 4px;font-size:1.15rem;}
  .d-head .sub{font-size:0.8rem;opacity:0.85;}
  .d-head-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:10px;}
  .hbtn{background:rgba(255,255,255,0.18);border:none;height:28px;padding:0 12px;border-radius:14px;font-size:0.72rem;font-weight:700;cursor:pointer;color:#fff;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
  .hbtn:hover{background:rgba(255,255,255,0.3);}
  .hbtn:disabled{opacity:0.6;cursor:default;}
  .hbtn.danger:hover{background:rgba(208,59,59,0.55);}

  /* ---- edit form ---- */
  .editform{padding-bottom:4px;}
  .editform .field{margin-bottom:14px;}
  .editform .field label.title{display:block;font-weight:600;margin-bottom:6px;font-size:0.9rem;}
  .editform input[type=text],.editform input[type=date],.editform input[type=number],.editform textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:12px;font-size:0.9rem;font-family:inherit;}
  .editform input:focus,.editform textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,140,131,0.15);}
  .editform textarea{min-height:56px;resize:vertical;}
  .editform .scale{display:flex;gap:6px;flex-wrap:wrap;}
  .editform .scale label{flex:1;min-width:40px;text-align:center;border:1px solid var(--border);border-radius:10px;padding:8px 4px;cursor:pointer;font-size:0.82rem;user-select:none;transition:background 0.1s,border-color 0.1s,color 0.1s;}
  .editform .scale input{display:none;}
  .editform .scale label.sel{background:var(--blue);color:#fff;border-color:var(--blue-dark);}
  .editform .q-edit-card{border:1px solid rgba(15,23,42,0.05);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fafcfc;}
  .editform .q-edit-card .q-edit-label{font-size:0.82rem;font-weight:700;color:var(--blue-dark);margin-bottom:6px;}
  .editform .q-edit-card .q-score-row{margin-top:8px;}
  .editform .q-edit-card .q-score-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .editform .q-edit-card .q-score-head span{font-size:0.75rem;font-weight:700;color:var(--ink-secondary);}
  .editform .q-edit-card .q-score-head a{font-size:0.72rem;color:var(--muted);text-decoration:none;}
  .editform .q-edit-card .q-score-head a:hover{text-decoration:underline;}
  .editform .disc-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .editform h3{margin:18px 0 10px;font-size:0.85rem;color:var(--ink-secondary);text-transform:uppercase;letter-spacing:0.04em;font-weight:700;}
  .edit-actions{display:flex;gap:10px;margin-top:4px;}
  .edit-actions button{flex:1;border:none;padding:12px;border-radius:999px;font-weight:700;font-size:0.9rem;cursor:pointer;}
  .edit-save{background:var(--blue);color:#fff;box-shadow:0 8px 16px -6px rgba(18,140,131,0.5);}
  .edit-save:hover{background:var(--blue-dark);}
  .edit-save:disabled{opacity:0.6;cursor:default;}
  .edit-cancel{background:#fff;border:1px solid var(--border) !important;color:var(--text);}
  .edit-cancel:hover{background:#f3f8f7;}
  .edit-err{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:0.85rem;background:var(--critical-bg);color:var(--critical-text);display:none;}

  /* ---- section wrapper ---- */
  .d-section{padding:18px 24px 0;}
  .d-section h3{margin:0 0 12px;font-size:0.85rem;color:var(--ink-secondary);text-transform:uppercase;letter-spacing:0.04em;font-weight:700;}

  /* ---- hero stat row ---- */
  .stat-row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;}
  .stat-tile{border:1px solid rgba(15,23,42,0.05);border-radius:16px;padding:14px 14px;background:#fafbfc;}
  .stat-tile .label{font-size:0.72rem;color:var(--ink-muted);font-weight:700;margin-bottom:6px;}
  .stat-tile .value{font-size:1.9rem;font-weight:800;line-height:1;color:var(--ink-primary);}
  .stat-tile .value small{font-size:0.95rem;font-weight:700;color:var(--ink-secondary);margin-left:2px;}
  .stat-tile.judge-ok{background:var(--good-bg);border-color:transparent;}
  .stat-tile.judge-ng{background:var(--critical-bg);border-color:transparent;}
  .stat-tile.judge-ok .value{color:var(--good-text);}
  .stat-tile.judge-ng .value{color:var(--critical-text);}
  .stat-tile .judge-text{font-size:0.85rem;font-weight:700;margin-top:2px;}
  .stat-tile.warn-min .value{color:var(--critical-text);}
  .stat-tile.warn-min .label::after{content:" ⚠";}

  /* ---- DISC type badge ---- */
  .disc-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;font-size:1rem;font-weight:800;color:#fff;margin-bottom:14px;}

  /* ---- bar rows (shared by DISC + criteria) ---- */
  .bar-row{display:grid;grid-template-columns:172px 1fr 40px;align-items:center;gap:10px;margin-bottom:9px;font-size:0.8rem;}
  .bar-row .bar-label{color:var(--ink-secondary);font-weight:600;white-space:normal;line-height:1.25;}
  .bar-track{background:#eef1f5;border-radius:8px;height:14px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;border-radius:8px 0 0 8px;box-shadow:inset -1px 0 0 rgba(11,11,11,0.12);}
  .bar-row .bar-value{text-align:right;font-weight:700;color:var(--ink-primary);font-variant-numeric:tabular-nums;}
  .bar-row .bar-weight{color:var(--ink-muted);font-weight:400;font-size:0.72rem;}

  .disc-profile{background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-size:0.85rem;color:var(--ink-secondary);margin-top:10px;}

  /* ---- strengths / weaknesses (derived from 評価シート・標準質問, kept separate from DISC) ---- */
  .sw-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .sw-box{border-radius:16px;padding:14px 16px;font-size:0.85rem;line-height:1.7;}
  .sw-box .sw-label{display:block;font-size:0.72rem;font-weight:800;margin-bottom:6px;letter-spacing:0.03em;}
  .sw-box.strengths{background:var(--good-bg);color:var(--good-text);}
  .sw-box.weaknesses{background:var(--critical-bg);color:var(--critical-text);}

  /* ---- compact PDF export layout (shrunk/auto-scaled to fit a single A4 page) ---- */
  .pdfdoc{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:var(--text);font-size:7.2pt;line-height:1.35;}
  .pdfdoc *{box-sizing:border-box;}
  .pdfdoc .ph{background:var(--blue);color:#fff;padding:9px 11px;border-radius:9px;margin-bottom:7px;}
  .pdfdoc .ph h2{margin:0;font-size:11pt;}
  .pdfdoc .ph .sub{font-size:7pt;opacity:0.85;margin-top:2px;}
  .pdfdoc .stats{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:5px;margin-bottom:7px;}
  .pdfdoc .stat{border:1px solid rgba(15,23,42,0.07);border-radius:8px;padding:5px 6px;background:#fafbfc;}
  .pdfdoc .stat.ok{background:var(--good-bg);}
  .pdfdoc .stat.ng{background:var(--critical-bg);}
  .pdfdoc .stat .l{font-size:6pt;color:var(--ink-muted);font-weight:700;margin-bottom:2px;}
  .pdfdoc .stat .v{font-size:11pt;font-weight:800;}
  .pdfdoc .cols2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px;align-items:start;}
  .pdfdoc .box{border:1px solid rgba(15,23,42,0.07);border-radius:8px;padding:7px 8px;}
  .pdfdoc .box h3{margin:0 0 4px;font-size:6.8pt;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-secondary);font-weight:700;}
  .pdfdoc .box.remarks{min-height:60px;margin-top:6px;}
  .pdfdoc .bar-row{display:grid;grid-template-columns:92px 1fr 16px;align-items:center;gap:4px;margin-bottom:3px;font-size:6.2pt;}
  .pdfdoc .bar-track{background:#eef1f5;border-radius:5px;height:6px;overflow:hidden;}
  .pdfdoc .bar-fill{height:100%;}
  .pdfdoc .disc-badge{display:inline-block;color:#fff;font-size:7.3pt;font-weight:800;padding:2px 9px;border-radius:999px;margin-bottom:4px;}
  .pdfdoc .profile{font-size:6.2pt;line-height:1.4;color:var(--ink-secondary);margin-top:3px;}
  .pdfdoc .sw{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:7px;}
  .pdfdoc .sw .swbox{border-radius:8px;padding:7px 8px;font-size:6.4pt;line-height:1.4;}
  .pdfdoc .sw .s1{background:var(--good-bg);color:var(--good-text);}
  .pdfdoc .sw .s2{background:var(--critical-bg);color:var(--critical-text);}
  .pdfdoc .sw .lbl{display:block;font-size:6pt;font-weight:800;margin-bottom:2px;}
  .pdfdoc .qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
  .pdfdoc .qa-card{border:1px solid rgba(15,23,42,0.07);border-radius:8px;padding:5px 6px;}
  .pdfdoc .qa-card .ql{font-size:6.1pt;font-weight:700;color:var(--blue-dark);display:flex;justify-content:space-between;}
  .pdfdoc .qa-card .qt{font-size:6.1pt;color:var(--text);margin-top:2px;line-height:1.35;word-break:break-word;}

  /* ---- Q&A cards ---- */
  .qa-card{border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;}
  .qa-card .q-label{background:#f1f5f9;padding:6px 12px;font-size:0.78rem;font-weight:700;color:var(--blue-dark);display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .qa-card .qa{white-space:pre-wrap;padding:10px 12px;font-size:0.85rem;color:var(--text);}
  .qa-card .qa.empty{color:var(--ink-muted);font-style:italic;}
  .qa-score{flex-shrink:0;display:inline-flex;align-items:baseline;justify-content:center;min-width:34px;height:20px;padding:0 7px;border-radius:999px;color:#fff;font-size:0.72rem;font-weight:800;}
  .qa-score small{font-weight:600;font-size:0.62rem;margin-left:1px;opacity:0.9;}

  #loading{display:none;color:var(--muted);font-size:0.9rem;}
  @media (max-width:480px){
    .stat-row{grid-template-columns:1fr 1fr;}
    .bar-row{grid-template-columns:104px 1fr 36px;font-size:0.72rem;}
    .sw-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<header>
  <nav class="top"><a href="index.html">評価入力</a><a href="results.html" class="active">結果一覧（管理者用）</a></nav>
  <h1>候補者 結果一覧（管理者用）</h1>
</header>
<main>
  <div class="card" id="gateCard">
    <p style="margin-top:0;font-size:0.9rem;color:var(--muted);">閲覧用パスフレーズを入力してください。</p>
    <div class="gate">
      <input type="password" id="pwInput" placeholder="パスフレーズ">
      <button id="loadBtn">表示する</button>
    </div>
    <div class="msg err" id="gateErr" style="display:none;"></div>
    <div id="loading">読み込み中...</div>
  </div>

  <div class="card" id="listCard" style="display:none;">
    <div class="toolbar">
      <span id="countLabel" style="font-size:0.85rem;color:var(--muted);"></span>
      <button id="csvBtn">CSVダウンロード</button>
    </div>
    <div class="table-wrap">
      <table id="resultTable">
        <thead>
          <tr>
            <th data-key="candidate_name">候補者氏名</th>
            <th data-key="interview_date">面接日</th>
            <th data-key="interviewer_name">面接官名</th>
            <th data-key="weighted_total">加重合計点</th>
            <th data-key="score_pct">得点率</th>
            <th data-key="judge">合否判定</th>
            <th data-key="disc_type">DISCタイプ</th>
            <th data-key="created_at">送信日時</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="detail" id="detailModal">
  <div class="detail-inner" id="detailInner"></div>
</div>

<script>
let rows = [];
let sortKey = 'created_at';
let sortDir = -1;
let currentPw = '';

const SQ_LABELS = ["Q1. きっかけ","Q2. 不安な点","Q3. 年下からの指導経験","Q4. 大変だった経験","Q5. 意見の違う相手との折り合い","Q6. ルール順守への考え","Q7. 屋外・体力作業への意欲","Q8. 腰を据えて取り組む期間","Q9. 5年後10年後の展望","Q10. 転職で大切にしたいこと"];
const CRIT_LABELS = ["①素直さ・受容力","②誠実さ・正直さ","③協調性・チームワーク","④責任感・やり抜く力","⑤向上心・成長ポテンシャル","⑥規範意識・安全遵守","⑦コミュニケーション力","⑧定着可能性・価値観の一致"];
const CRIT_WEIGHTS = [1.5,1.5,1.0,1.0,1.5,1.0,1.0,1.5];
const SEQ_STEPS = {1:'var(--seq-1)',2:'var(--seq-2)',3:'var(--seq-3)',4:'var(--seq-4)',5:'var(--seq-5)'};
const DISC_META = {
  'D（主導型）': {key:'D', color:'var(--cat-1)', total:'disc_d_total'},
  'I（感化型）': {key:'I', color:'var(--cat-2)', total:'disc_i_total'},
  'S（安定型）': {key:'S', color:'var(--cat-3)', total:'disc_s_total'},
  'C（慎重型）': {key:'C', color:'var(--cat-4)', total:'disc_c_total'},
};

// ---- より細分化したDISCタイプ判定（D/I/S/Cの素点から主・副タイプと強度を判定し、種類数を増やす） ----
const TYPE_META = {
  D: {label:'D（主導型）', short:'主導', color:'var(--cat-1)'},
  I: {label:'I（感化型）', short:'感化', color:'var(--cat-2)'},
  S: {label:'S（安定型）', short:'安定', color:'var(--cat-3)'},
  C: {label:'C（慎重型）', short:'慎重', color:'var(--cat-4)'},
};
const DISC_PROFILES = {
  "D（主導型）": "この人は、スピード感を持って物事を進め、自分で決めて行動することを好むタイプです。結論から話し、要点を絞って判断する傾向があります。指示を細かく出しすぎるより、目標とゴールを明確に伝えたうえで裁量を持たせると力を発揮しやすく、当社の緊急対応業務のように「自分で判断して動く」場面で強みになる可能性があります。一方で、手順の細かい説明を省略しがちな面もあるため、安全手順は明文化して念押しすると良い関わり方になります。",
  "I（感化型）": "この人は、人当たりが良く、周囲を明るくする力を持つタイプです。初対面でも打ち解けやすく、場の雰囲気をつくるのが得意な傾向があります。お客様（施主・管理会社等）対応や、後輩への声かけなど対人場面で力を発揮しやすい一方、一人で黙々と作業が続く時間が長いと意欲が下がることがあるため、こまめな声かけやチームでの関わりを意識すると定着しやすくなります。",
  "S（安定型）": "この人は、落ち着いて着実に物事を進めることを好むタイプです。急な変化よりも、決まった手順の中でコツコツ取り組むことに安心感を持ちやすい傾向があります。丁寧なOJTと安定した環境のもとで力を発揮しやすく、長期的な信頼関係を築きながら育成すると定着につながりやすいタイプです。変化や新しい役割を求めるときは、事前に十分な説明と準備期間を設けると良い関わり方になります。",
  "C（慎重型）": "この人は、正確さや根拠を大切にし、慎重に考えてから行動するタイプです。質問に対して具体的な数字や理由を添えて答える傾向があり、曖昧な指示より基準や手順が明確な方が力を発揮しやすい傾向があります。水質検査など正確性が求められる作業や安全確認の場面と相性が良い可能性がある一方、即断即決を求めすぎると本来の力が出にくいため、考える時間を確保する関わり方が適しています。"
};
const DISC_SECONDARY_BLURB = {
  D: 'また、物事を素早く決めて行動しようとするD（主導型）の傾向も併せ持っています。',
  I: 'また、人との関わりを楽しみ、場を明るくしようとするI（感化型）の傾向も併せ持っています。',
  S: 'また、落ち着いて着実に取り組もうとするS（安定型）の傾向も併せ持っています。',
  C: 'また、正確さや根拠を重視し、慎重に行動しようとするC（慎重型）の傾向も併せ持っています。',
};
function classifyDisc(dSum, iSum, sSum, cSum){
  const sums = [
    {key:'D', sum:dSum||0},
    {key:'I', sum:iSum||0},
    {key:'S', sum:sSum||0},
    {key:'C', sum:cSum||0},
  ];
  const sorted = [...sums].sort((a,b) => b.sum - a.sum);
  const primary = sorted[0], secondary = sorted[1];
  const gap = primary.sum - secondary.sum;
  const isBlend = gap <= 3 && secondary.sum >= 6;

  let intensity;
  if(primary.sum >= 13) intensity = '非常に強い';
  else if(primary.sum >= 10) intensity = '強い';
  else if(primary.sum >= 7) intensity = '標準的な';
  else intensity = '穏やかな';

  const pMeta = TYPE_META[primary.key];
  const sMeta = TYPE_META[secondary.key];

  let label, profile;
  if(isBlend){
    label = `${primary.key}${secondary.key}型（${pMeta.short}×${sMeta.short}）`;
    profile = DISC_PROFILES[pMeta.label] + ' ' + DISC_SECONDARY_BLURB[secondary.key];
  }else{
    label = `${pMeta.label}（${intensity}傾向）`;
    let framing;
    if(intensity === '非常に強い') framing = `${pMeta.label}の特性が非常に強く表れています。`;
    else if(intensity === '強い') framing = `${pMeta.label}の特性が強く表れています。`;
    else if(intensity === '標準的な') framing = `${pMeta.label}の特性が最も強く出ていますが、突出した偏りではなく標準的な範囲です。`;
    else framing = `${pMeta.label}の傾向が相対的に高いものの、全体として控えめ・穏やかな反応が多く見られました。`;
    profile = framing + ' ' + DISC_PROFILES[pMeta.label];
  }

  return {
    label, profile, isBlend,
    primaryKey: primary.key, secondaryKey: secondary.key,
    primaryColor: pMeta.color, secondaryColor: sMeta.color,
  };
}

const SQ_SHORT = SQ_LABELS.map(l => l.replace(/^Q\d+\.\s*/, ''));

// 長所・短所は評価シート（8項目）と標準質問の点数のみから自動生成する（DISCのデータは一切使わない）
const SW_STRENGTH_PHRASES = [
  "指摘やアドバイスを前向きに受け止め、素直に行動を改善できる点",
  "ミスや弱みを隠さず、誠実に向き合おうとする姿勢",
  "周囲と協力しながらチームで物事を進められる協調性",
  "最後までやり抜こうとする責任感の強さ",
  "未経験の分野にも前向きに挑戦しようとする向上心",
  "ルールや安全手順を大切にする規範意識",
  "初対面の相手とも円滑にやり取りできるコミュニケーション力",
  "長く働きたいという意欲と当社の考え方との親和性"
];
const SW_WEAKNESS_PHRASES = [
  "指摘を素直に受け止める姿勢にやや弱さが見られる点",
  "誠実さ・正直さの面でやや懸念が見られる点",
  "チームでの協調性にやや不安が残る点",
  "責任感・粘り強さの面でフォローが必要と思われる点",
  "成長意欲や向上心がやや弱く感じられる点",
  "ルール順守・安全意識の面でやや懸念がある点",
  "コミュニケーション面でやや課題が見られる点",
  "定着可能性や当社の考え方との親和性にやや不安がある点"
];

function buildStrengthsWeaknesses(critVals, qScores, qShortLabels){
  const strengths = [];
  const weaknesses = [];
  critVals.forEach((v, i) => {
    if(v === null || v === undefined) return;
    if(v >= 4) strengths.push(SW_STRENGTH_PHRASES[i]);
    else if(v <= 2) weaknesses.push(SW_WEAKNESS_PHRASES[i]);
  });

  const strongQ = [];
  const weakQ = [];
  (qScores || []).forEach((s, i) => {
    if(s === null || s === undefined) return;
    if(s >= 5) strongQ.push(qShortLabels[i]);
    else if(s <= 1) weakQ.push(qShortLabels[i]);
  });

  let strengthsText = strengths.length
    ? '評価シートでは、' + strengths.join('、') + 'といった点が強みとして挙げられます。'
    : '評価シートの各項目は標準的な範囲内で、突出した強みは確認されませんでした。';
  if(strongQ.length) strengthsText += ' また、標準質問「' + strongQ.join('」「') + '」の回答は特に高い評価でした。';

  let weaknessesText = weaknesses.length
    ? '評価シートでは、' + weaknesses.join('、') + 'といった点にやや懸念が見られます。'
    : '評価シートの各項目に大きな懸念点は見られませんでした。';
  if(weakQ.length) weaknessesText += ' また、標準質問「' + weakQ.join('」「') + '」の回答には特に注意が必要です。';

  return { strengths: strengthsText, weaknesses: weaknessesText };
}

async function loadResults(){
  const gateErr = document.getElementById('gateErr');
  const loading = document.getElementById('loading');
  gateErr.style.display = 'none';
  const pw = document.getElementById('pwInput').value;
  if(!pw){ gateErr.textContent = 'パスフレーズを入力してください。'; gateErr.style.display='block'; return; }

  if(!SUPABASE_URL || SUPABASE_URL.indexOf('YOUR_') === 0){
    gateErr.textContent = 'アプリの設定が未完了です（config.js を確認してください）。';
    gateErr.style.display = 'block';
    return;
  }

  loading.style.display = 'block';
  try{
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await client.rpc('get_results', { pw: pw });
    if(error) throw error;
    if(!data || data.length === 0){
      gateErr.textContent = 'パスフレーズが違うか、データがまだありません。';
      gateErr.style.display = 'block';
      loading.style.display = 'none';
      return;
    }
    rows = data;
    currentPw = pw;
    document.getElementById('gateCard').style.display = 'none';
    document.getElementById('listCard').style.display = 'block';
    render();
  }catch(err){
    console.error(err);
    gateErr.textContent = '読み込みに失敗しました: ' + (err.message || err);
    gateErr.style.display = 'block';
  }finally{
    loading.style.display = 'none';
  }
}

function render(){
  const sorted = [...rows].sort((a,b) => {
    let av = a[sortKey], bv = b[sortKey];
    if(av === null || av === undefined) av = '';
    if(bv === null || bv === undefined) bv = '';
    if(typeof av === 'number' && typeof bv === 'number') return (av-bv)*sortDir;
    return String(av).localeCompare(String(bv), 'ja') * sortDir;
  });
  document.getElementById('countLabel').textContent = `${sorted.length} 件`;
  const tbody = document.getElementById('resultBody');
  tbody.innerHTML = '';
  sorted.forEach(r => {
    const tr = document.createElement('tr');
    const badgeClass = (r.judge || '').indexOf('◎') === 0 ? 'ok' : 'ng';
    tr.innerHTML = `
      <td>${escapeHtml(r.candidate_name)}</td>

  });
}

function showDetail(r){
  const inner = document.getElementById('detailInner');
  const isPass = (r.judge || '').indexOf('◎') === 0;
  const judgeClass = isPass ? 'judge-ok' : 'judge-ng';
  const judgeIcon = isPass ? '◎' : '△';

  // ---- hero stat tiles ----
  const minWarn = r.min_score <= 2 ? ' warn-min' : '';
  const statHtml = `
    <div class="stat-row">
      <div class="stat-tile">
        <div class="label">加重合計点</div>
        <div class="value">${r.weighted_total}<small>点 / ${r.score_pct}%</small></div>
      </div>
      <div class="stat-tile ${judgeClass}">
        <div class="label">合否判定</div>
        <div class="value">${judgeIcon}</div>
        <div class="judge-text">${escapeHtml(r.judge)}</div>
      </div>
      <div class="stat-tile${minWarn}">
        <div class="label">最低得点</div>
        <div class="value">${r.min_score}<small>点</small></div>
      </div>
    </div>
  `;

  // ---- DISC bar chart (categorical, fixed order D/I/S/C) ----
  const discResult = classifyDisc(r.disc_d_total, r.disc_i_total, r.disc_s_total, r.disc_c_total);
  const discMax = 15;
  const discOrder = ['D（主導型）','I（感化型）','S（安定型）','C（慎重型）'];
  const discBars = discOrder.map(type => {
    const meta = DISC_META[type];
    const total = r[meta.total] || 0;
    const pct = Math.round((total / discMax) * 100);
    const isPrimary = meta.key === discResult.primaryKey;
    const isSecondary = discResult.isBlend && meta.key === discResult.secondaryKey;
    const labelStyle = isPrimary ? `font-weight:800;color:${meta.color};` : isSecondary ? `font-weight:700;color:${meta.color};opacity:0.85;` : '';
    return `
      <div class="bar-row">
        <span class="bar-label" style="${labelStyle}">${type}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${meta.color};"></div></div>
        <span class="bar-value">${total}</span>
      </div>`;
  }).join('');
  const discBadgeBg = discResult.isBlend
    ? `linear-gradient(90deg, ${discResult.primaryColor}, ${discResult.secondaryColor})`
    : discResult.primaryColor;
  const discHtml = `
    <div class="d-section">
      <h3>DISCタイプ判定</h3>
      <span class="disc-badge" style="background:${discBadgeBg};">${escapeHtml(discResult.label)}</span>
      ${discBars}
      <div class="disc-profile">${escapeHtml(discResult.profile)}</div>
    </div>
  `;

  // ---- criteria bar chart (sequential, magnitude 1-5) ----
  const critBars = CRIT_LABELS.map((label,i) => {
    const v = r['crit'+(i+1)];
    const pct = Math.round((v/5)*100);
    return `
      <div class="bar-row">
        <span class="bar-label">${label}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${SEQ_STEPS[v]||'var(--seq-3)'};"></div></div>
        <span class="bar-value">${v}<span class="bar-weight">/5</span></span>
      </div>`;
  }).join('');
  const critHtml = `
    <div class="d-section">
      <h3>評価シート（8項目・ウエイト付き加重採点）</h3>
      ${critBars}
    </div>
  `;

  // ---- 長所・短所（評価シート・標準質問のみから自動生成、DISCとは完全に切り離して算出） ----
  const critValsForSw = [r.crit1, r.crit2, r.crit3, r.crit4, r.crit5, r.crit6, r.crit7, r.crit8];
  const qScoresForSw = [r.q1_score, r.q2_score, r.q3_score, r.q4_score, r.q5_score, r.q6_score, r.q7_score, r.q8_score, r.q9_score, r.q10_score];
  const sw = buildStrengthsWeaknesses(critValsForSw, qScoresForSw, SQ_SHORT);
  const swHtml = `
    <div class="d-section">
      <h3>長所・短所（評価シート・標準質問より自動生成）</h3>
      <div class="sw-grid">
        <div class="sw-box strengths"><span class="sw-label">長所</span>${escapeHtml(sw.strengths)}</div>
        <div class="sw-box weaknesses"><span class="sw-label">短所</span>${escapeHtml(sw.weaknesses)}</div>
      </div>
    </div>
  `;

  // ---- Q&A cards (memo + optional per-question score) ----
  let qaHtml = '';
  for(let i=1;i<=10;i++){
    const v = r['q'+i];
    const score = r['q'+i+'_score'];
    if(!v && !score) continue;
    const scoreBadge = score ? `<span class="qa-score" style="background:${SEQ_STEPS[score]||'var(--seq-3)'};">${score}<small>/5</small></span>` : '';
    const noteHtml = v ? escapeHtml(v) : '(メモなし)';
    qaHtml += `<div class="qa-card"><div class="q-label"><span>${SQ_LABELS[i-1]}</span>${scoreBadge}</div><div class="qa${v ? '' : ' empty'}">${noteHtml}</div></div>`;
  }
  const qaSection = qaHtml ? `<div class="d-section"><h3>標準質問10選 メモ</h3>${qaHtml}</div>` : '';

  // ---- 総合所見（管理者コメント。PDFにも反映され、PDF下部の空白を埋める用途を兼ねる） ----
  const hasRemarks = r.admin_comment && String(r.admin_comment).trim();
  const remarksBody = hasRemarks
    ? escapeHtml(r.admin_comment)
    : '<span style="color:var(--ink-muted);font-style:italic;">（記載なし。「編集」から入力できます）</span>';
  const remarksScreenHtml = `
    <div class="d-section">
      <h3>総合所見</h3>
      <div class="disc-profile" style="white-space:pre-wrap;">${remarksBody}</div>
    </div>
  `;

  inner.innerHTML = `
    <div class="d-head">
      <div class="d-head-actions">
        <button class="hbtn" id="pdfDetail">PDF ダウンロード</button>
        <button class="hbtn" id="editDetail">編集</button>
        <button class="hbtn danger" id="deleteDetail">削除</button>
        <button class="closeBtn" id="closeDetail">×</button>
      </div>
      <h2>${escapeHtml(r.candidate_name)}</h2>
      <div class="sub">${escapeHtml(r.interview_date)} ／ 面接官: ${escapeHtml(r.interviewer_name)}</div>
    </div>
    <div class="d-section">${statHtml}</div>
    ${critHtml}
    ${swHtml}
    ${qaSection}
    ${discHtml}
    ${remarksScreenHtml}
  `;
  document.getElementById('detailModal').classList.add('show');
  document.getElementById('closeDetail').addEventListener('click', () => {
    document.getElementById('detailModal').classList.remove('show');
  });
  document.getElementById('pdfDetail').addEventListener('click', () => downloadDetailPdf(r));
  document.getElementById('editDetail').addEventListener('click', () => showEditForm(r));
  document.getElementById('deleteDetail').addEventListener('click', () => deleteRow(r));
}

function buildEditScale(container, name, initialVal, selColor){
  const wrap = document.createElement('div');
  wrap.className = 'scale';
  for(let v=1; v<=5; v++){
    const id = name + '_' + v;
    const label = document.createElement('label');
    label.setAttribute('for', id);
    label.textContent = String(v);
    const input = document.createElement('input');
    input.type = 'radio'; input.name = name; input.value = v; input.id = id;
    if(Number(initialVal) === v){
      input.checked = true;
      label.classList.add('sel');
      if(selColor){ label.style.background = selColor; label.style.borderColor = selColor; }
    }
    input.addEventListener('change', () => {
      wrap.querySelectorAll('label').forEach(l => { l.classList.remove('sel'); l.style.background=''; l.style.borderColor=''; });
      label.classList.add('sel');
      if(selColor){ label.style.background = selColor; label.style.borderColor = selColor; }
    });
    label.prepend(input);
    wrap.appendChild(label);
  }
  container.appendChild(wrap);
}

function getEditScale(name){
  const el = document.querySelector(`input[name="${name}"]:checked`);
  return el ? Number(el.value) : null;
}

  }
  const adminComment = document.getElementById('edit_admin_comment').value;

  saveBtn.disabled = true;
  saveBtn.textContent = '保存中...';

  try{
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await client.rpc('update_result', {
      pw: currentPw, p_id: r.id,
      p_candidate_name: candidateName, p_interview_date: interviewDate, p_interviewer_name: interviewerName,
      p_q1: qTexts.q1, p_q2: qTexts.q2, p_q3: qTexts.q3, p_q4: qTexts.q4, p_q5: qTexts.q5,
      p_q6: qTexts.q6, p_q7: qTexts.q7, p_q8: qTexts.q8, p_q9: qTexts.q9, p_q10: qTexts.q10,
      p_q1_score: qScores.q1_score, p_q2_score: qScores.q2_score, p_q3_score: qScores.q3_score,
      p_q4_score: qScores.q4_score, p_q5_score: qScores.q5_score, p_q6_score: qScores.q6_score,
      p_q7_score: qScores.q7_score, p_q8_score: qScores.q8_score, p_q9_score: qScores.q9_score,
      p_q10_score: qScores.q10_score,
      p_crit1: critVals[0], p_crit2: critVals[1], p_crit3: critVals[2], p_crit4: critVals[3],
      p_crit5: critVals[4], p_crit6: critVals[5], p_crit7: critVals[6], p_crit8: critVals[7],
      p_disc_d_total: discD, p_disc_i_total: discI, p_disc_s_total: discS, p_disc_c_total: discC,
      p_admin_comment: adminComment
    });
    if(error) throw error;
    if(data !== true){
      errBox.textContent = '更新に失敗しました（権限エラーまたはデータが見つかりません）。ページを再読み込みしてやり直してください。';
      errBox.style.display = 'block';
      saveBtn.disabled = false;
      saveBtn.textContent = '保存する';
      return;
    }

    // ---- サーバー側と同じ計算式でローカルの行データも更新し、再読み込みなしで再描画する ----
    let total = 0, minScore = 99;
    critVals.forEach((v,i) => { total += v*CRIT_WEIGHTS[i]; if(v<minScore) minScore = v; });
    total = Math.round(total*10)/10;
    const pct = Math.round((total/50)*1000)/10;
    const judge = (total >= 30 && minScore >= 2) ? '◎ 合格基準を満たしています' : '△ 要検討（基準未達の項目があります）';

    Object.assign(r, {
      candidate_name: candidateName, interview_date: interviewDate, interviewer_name: interviewerName,
      q1: qTexts.q1, q2: qTexts.q2, q3: qTexts.q3, q4: qTexts.q4, q5: qTexts.q5,
      q6: qTexts.q6, q7: qTexts.q7, q8: qTexts.q8, q9: qTexts.q9, q10: qTexts.q10,
      q1_score: qScores.q1_score, q2_score: qScores.q2_score, q3_score: qScores.q3_score,
      q4_score: qScores.q4_score, q5_score: qScores.q5_score, q6_score: qScores.q6_score,
      q7_score: qScores.q7_score, q8_score: qScores.q8_score, q9_score: qScores.q9_score,
      q10_score: qScores.q10_score,
      crit1: critVals[0], crit2: critVals[1], crit3: critVals[2], crit4: critVals[3],
      crit5: critVals[4], crit6: critVals[5], crit7: critVals[6], crit8: critVals[7],
      disc_d_total: discD, disc_i_total: discI, disc_s_total: discS, disc_c_total: discC,
      admin_comment: adminComment,
      weighted_total: total, score_pct: pct, min_score: minScore, judge: judge
    });

    render();
    showDetail(r);
  }catch(err){
    console.error(err);
    errBox.textContent = '保存に失敗しました: ' + (err.message || err);
    errBox.style.display = 'block';
    saveBtn.disabled = false;
    saveBtn.textContent = '保存する';
  }
}

async function deleteRow(r){
  if(!confirm(`「${r.candidate_name}」さんの評価結果を削除します。この操作は取り消せません。よろしいですか？`)) return;
  const btn = document.getElementById('deleteDetail');
  if(btn){ btn.disabled = true; btn.textContent = '削除中...'; }
  try{
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await client.rpc('delete_result', { pw: currentPw, p_id: r.id });
    if(error) throw error;
    if(data !== true){
      alert('削除に失敗しました（権限エラーまたはデータが見つかりません）。');
      if(btn){ btn.disabled = false; btn.textContent = '削除'; }
      return;
    }
    rows = rows.filter(x => x.id !== r.id);
    document.getElementById('detailModal').classList.remove('show');
    render();
  }catch(err){
    console.error(err);
    alert('削除に失敗しました: ' + (err.message || err));
    if(btn){ btn.disabled = false; btn.textContent = '削除'; }
  }
}

function truncateText(s, max){
  if(s === null || s === undefined) return '';
  s = String(s);
  if(s.length <= max) return s;
  return s.slice(0, max - 1) + '…';
}

// ---- PDF専用のコンパクトな1枚レイアウトを生成する（画面表示用のshowDetailとは別に組み立てる） ----
function buildPdfHtml(r){
  const isPass = (r.judge || '').indexOf('◎') === 0;
  const judgeClass = isPass ? 'ok' : 'ng';
  const judgeIcon = isPass ? '◎' : '△';

  const statHtml = `
    <div class="stats">
      <div class="stat">
        <div class="l">加重合計点</div>
        <div class="v">${r.weighted_total}<span style="font-size:7pt;font-weight:700;">点/${r.score_pct}%</span></div>
      </div>
      <div class="stat ${judgeClass}">
        <div class="l">合否判定</div>
        <div class="v">${judgeIcon} <span style="font-size:7pt;">${escapeHtml(r.judge)}</span></div>
      </div>
      <div class="stat">
        <div class="l">最低得点</div>
        <div class="v">${r.min_score}<span style="font-size:7pt;font-weight:700;">点</span></div>
      </div>
    </div>
  `;

  const critBars = CRIT_LABELS.map((label, i) => {
    const v = r['crit' + (i + 1)];
    const pct = Math.round((v / 5) * 100);
    return `
      <div class="bar-row">
        <span>${label.replace(/（ウエイト[^）]*）/, '')}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${SEQ_STEPS[v] || 'var(--seq-3)'};"></div></div>
        <span style="text-align:right;font-weight:700;">${v}</span>
      </div>`;
  }).join('');

  const discResult = classifyDisc(r.disc_d_total, r.disc_i_total, r.disc_s_total, r.disc_c_total);
  const discMax = 15;
  const discOrder = ['D（主導型）', 'I（感化型）', 'S（安定型）', 'C（慎重型）'];
  const discBars = discOrder.map(type => {
    const meta = DISC_META[type];
    const total = r[meta.total] || 0;
    const pct = Math.round((total / discMax) * 100);
    return `
      <div class="bar-row">
        <span>${type}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${meta.color};"></div></div>
        <span style="text-align:right;font-weight:700;">${total}</span>
      </div>`;
  }).join('');
  const discBadgeBg = discResult.isBlend
    ? `linear-gradient(90deg, ${discResult.primaryColor}, ${discResult.secondaryColor})`
    : discResult.primaryColor;

  const critValsForSw = [r.crit1, r.crit2, r.crit3, r.crit4, r.crit5, r.crit6, r.crit7, r.crit8];
  const qScoresForSw = [r.q1_score, r.q2_score, r.q3_score, r.q4_score, r.q5_score, r.q6_score, r.q7_score, r.q8_score, r.q9_score, r.q10_score];
  const sw = buildStrengthsWeaknesses(critValsForSw, qScoresForSw, SQ_SHORT);

  let qaHtml = '';
  for(let i = 1; i <= 10; i++){
    const v = r['q' + i];
    const score = r['q' + i + '_score'];
    if(!v && !score) continue;
    const scoreBadge = score ? `<span style="background:${SEQ_STEPS[score] || 'var(--seq-3)'};color:#fff;border-radius:6px;padding:0 4px;">${score}</span>` : '';
    const noteText = v ? escapeHtml(truncateText(v, 85)) : '(メモなし)';
    qaHtml += `<div class="qa-card"><div class="ql"><span>${SQ_SHORT[i - 1]}</span>${scoreBadge}</div><div class="qt">${noteText}</div></div>`;
  }
  const qaSection = qaHtml ? `<div class="box" style="margin-bottom:6px;"><h3>標準質問10選 メモ</h3><div class="qa-grid">${qaHtml}</div></div>` : '';

  // ---- 総合所見（管理者コメント）。あれば表示し、PDF下部の余白を自然に埋める ----
  const remarksText = (r.admin_comment && String(r.admin_comment).trim())
    ? escapeHtml(truncateText(r.admin_comment, 420))
    : '<span style="color:var(--ink-muted);font-style:italic;">（記載なし）</span>';
  const remarksHtml = `
    <div class="box remarks">
      <h3>総合所見</h3>
      <div class="profile" style="margin-top:0;white-space:pre-wrap;">${remarksText}</div>
    </div>
  `;

  return `
    <div class="ph">
      <h2>${escapeHtml(r.candidate_name)}</h2>
      <div class="sub">${escapeHtml(r.interview_date)} ／ 面接官: ${escapeHtml(r.interviewer_name)}</div>
    </div>
    ${statHtml}
    <div class="cols2">
      <div class="box">
        <h3>評価シート（8項目）</h3>
        ${critBars}
      </div>
      <div class="box">
        <h3>DISCタイプ判定</h3>
        <span class="disc-badge" style="background:${discBadgeBg};">${escapeHtml(discResult.label)}</span>
        ${discBars}
        <div class="profile">${escapeHtml(truncateText(discResult.profile, 170))}</div>
      </div>
    </div>
    <div class="sw">
      <div class="swbox s1"><span class="lbl">長所</span>${escapeHtml(truncateText(sw.strengths, 180))}</div>
      <div class="swbox s2"><span class="lbl">短所</span>${escapeHtml(truncateText(sw.weaknesses, 180))}</div>
    </div>
    ${qaSection}
    ${remarksHtml}
  `;
}

function downloadDetailPdf(r){
  const btn = document.getElementById('pdfDetail');
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '作成中...';

  const safeName = String(r.candidate_name || '候補者').replace(/[\\/:*?"<>|]/g, '_');
  const safeDate = String(r.interview_date || '').replace(/[\\/:*?"<>|]/g, '_');

  // ---- 専用のコンパクトレイアウトをcanvas化し、画像としてA4 1枚のPDFページに収まるよう縮小配置する ----
  // (html2canvasは画面外(position:fixed; left:-10000px)の要素を素のwindow幅でクローンすると高さを0と
  //  誤測定することがあるため、windowWidthをステージ幅に明示的に合わせて正しく計測させている)
  const MM_TO_PX = 3.7795275591;
  const MARGIN_MM = 8;
  const PAGE_W_MM = 210, PAGE_H_MM = 297;
  const contentWpx = Math.round((PAGE_W_MM - MARGIN_MM * 2) * MM_TO_PX);

  const stage = document.createElement('div');
  stage.className = 'pdfdoc';
  stage.style.position = 'fixed';
  stage.style.left = '-10000px';
  stage.style.top = '0';
  stage.style.width = contentWpx + 'px';
  stage.style.background = '#ffffff';
  stage.innerHTML = buildPdfHtml(r);
  document.body.appendChild(stage);

  html2canvas(stage, { scale: 3, useCORS: true, backgroundColor: '#ffffff', windowWidth: contentWpx }).then((canvas) => {
    document.body.removeChild(stage);

    const imgWmm = PAGE_W_MM - MARGIN_MM * 2;
    const maxHmm = PAGE_H_MM - MARGIN_MM * 2;
    let drawWmm = imgWmm;
    let drawHmm = imgWmm * (canvas.height / canvas.width);
    if(drawHmm > maxHmm){
      drawHmm = maxHmm;
      drawWmm = drawHmm * (canvas.width / canvas.height);
    }
    const x = MARGIN_MM + (imgWmm - drawWmm) / 2;
    const y = MARGIN_MM;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
    doc.addImage(canvas.toDataURL('image/png'), 'PNG', x, y, drawWmm, drawHmm);
    doc.save(`スイカン面接評価_${safeName}_${safeDate}.pdf`);

    btn.disabled = false;
    btn.textContent = origText;
  }).catch((err) => {
    console.error(err);
    if(stage.parentNode) document.body.removeChild(stage);
    btn.disabled = false;
    btn.textContent = origText;
    alert('PDFの作成に失敗しました: ' + (err.message || err));
  });
}

document.getElementById('detailModal').addEventListener('click', (e) => {
  if(e.target.id === 'detailModal') document.getElementById('detailModal').classList.remove('show');
});

document.getElementById('csvBtn').addEventListener('click', () => {
  if(rows.length === 0) return;
  const headers = Object.keys(rows[0]);
  const csvLines = [headers.join(',')];
  rows.forEach(r => {
    csvLines.push(headers.map(h => {
      let v = r[h];
      if(v === null || v === undefined) v = '';
      v = String(v).replace(/"/g,'""');
      return `"${v}"`;
    }).join(','));
  });
  const blob = new Blob(["﻿" + csvLines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sukan_evaluations_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
});

function escapeHtml(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
